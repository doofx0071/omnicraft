<!doctype html>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #010409;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        width: min(96vw, 720px);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #161b22;
        border: 1px solid #30363d;
        border-bottom: 0;
        border-radius: 8px 8px 0 0;
        padding: 8px 12px;
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .bar span {
        color: #8b949e;
        font-size: 12px;
        margin-left: 6px;
      }
      .bar button {
        margin-left: auto;
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      .bar button:hover {
        background: #30363d;
      }
      .term {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 0 0 8px 8px;
        padding: 20px 16px;
        overflow-x: auto;
      }
      pre {
        margin: 0;
        font:
          13px/1.55 Consolas,
          "Cascadia Mono",
          monospace;
        white-space: pre;
      }
      .B {
        color: #6e7681;
      }
      .T {
        color: #e6edf3;
      }
      .D {
        color: #8b949e;
      }
      .I {
        color: #56d4dd;
      }
      .K {
        color: #3fb950;
      }
      .G {
        color: undefined;
      }
      .U {
        color: #58a6ff;
      }
      .W {
        color: #ffffff;
      }
      .Y {
        color: #d29922;
      }
      .cursor {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: #e6edf3;
        vertical-align: -2px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>

            { c: "T", t: "Crafted! Happy building ⚡" },
          ],
          delay: 380,
        },
        { k: "pause", delay: 1600 },
      ];
      const CURSOR = '<span class="cursor"></span>';
      const out = document.getElementById("out");
      let lines = [],
        timers = [];

      function esc(t) {
        return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function span(s) {
        return '<span class="' + s.c + '">' + esc(s.t) + "</span>";
      }
      function render(typing) {
        out.innerHTML =
          lines.map((l) => "<div>" + l.map(span).join("") + "</div>").join("") +
          (typing ? "<div>" + CURSOR + "</div>" : "");
        window.scrollTo(0, document.body.scrollHeight);
      }
      function schedule(fn, delay) {
        timers.push(setTimeout(fn, delay));
      }
      function play() {
        timers.forEach(clearTimeout);
        timers = [];
        lines = [];
        out.innerHTML = "";
        let t = 300;
        for (const op of TL) {
          if (op.k === "out") {
            schedule(() => {
              lines.push(op.spans);
              render(false);
            }, t);
            t += Math.max(op.delay, 60);
          } else if (op.k === "type") {
            schedule(() => {
              lines.push([...op.base]);
              render(true);
            }, t);
            for (let i = 1; i <= op.text.length; i++) {
              schedule(
                ((n) => () => {
                  lines[lines.length - 1] = [...op.base, { c: op.cls, t: op.text.slice(0, n) }];
                  render(true);
                })(i),
                t + i * op.delay,
              );
            }
            t += op.text.length * op.delay + 60;
          } else if (op.k === "pause") {
            t += op.delay;
          }
        }
        schedule(() => render(false), t + 100);
      }
      document.getElementById("replay").addEventListener("click", play);
      play();
