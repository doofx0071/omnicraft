# CI for OmniCraft.
#
# Security model (repo is PUBLIC):
# - `pull_request` from forks runs the `unix` jobs on GitHub-hosted runners only.
# - The self-hosted Windows runner executes push-to-main and same-repo PR events
#   only — never fork PRs (untrusted code must not run on a persistent machine).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  # Hosted runners on 3 OSes x Node {20 (declared minimum), 24}.
  # bash is pinned: hosted Windows defaults to pwsh, which can't run the
  # cmd-style cleanup; Git Bash is preinstalled and cross-platform.
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    name: unix (${{ matrix.os }}, node ${{ matrix.node }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit
        working-directory: packages/cli

      - name: Unit tests
        run: npx vitest run
        working-directory: packages/cli

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Scaffold all stack combos
        run: |
          rm -rf smoke-out
          npx tsx packages/cli/scripts/smoke-e2e.ts smoke-out

      # Heavy e2e only on Node 24 to keep the matrix lean;
      # fast checks prove Node 20 (declared minimum) compatibility.
      - name: E2E - install and typecheck generated express+drizzle project
        run: cd smoke-out/smoke-express-drizzle-postgres && npm install --no-audit --no-fund && npx tsc --noEmit -p client && npx tsc --noEmit -p server
        if: matrix.node == 24

  # Docker integration stays on hosted Linux runners and does not slow the
  # cross-platform unit/scaffold matrix or run on the persistent Windows host.
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated Express + Drizzle against SQLite, PostgreSQL, and MySQL
        run: npm run test:integration:db --workspace=create-omnicraft

  php-laravel-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated Laravel API against SQLite, PostgreSQL, and MySQL
        run: npm run test:integration:php --workspace=create-omnicraft

  python-fastapi-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated FastAPI + SQLAlchemy + SQLite project
        run: npm run test:integration:python --workspace=create-omnicraft

  support-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Check Supported rows, evidence targets, and release gate
        run: npm run check:support-matrix --workspace=create-omnicraft

  # Trusted events only: the self-hosted runner never executes fork PR code.
  windows-self-hosted:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit
        working-directory: packages/cli

      - name: Unit tests
        run: npx vitest run
        working-directory: packages/cli

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Scaffold all stack combos
        run: |
          if exist smoke-out rmdir /s /q smoke-out
          npx tsx packages/cli/scripts/smoke-e2e.ts smoke-out

      - name: E2E - install and typecheck generated express+drizzle project
        run: cd smoke-out\smoke-express-drizzle-postgres && npm install --no-audit --no-fund && npx tsc --noEmit -p client && npx tsc --noEmit -p server

      - name: Lint generated project output
        run: cd smoke-out\smoke-express-drizzle-postgres && npx eslint . && npx prettier --check .

  # Package-artifact e2e: pack the tarball, install it into a clean temp dir,
  # run the published-style binary and scaffold a real project from it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Pack tarball
        run: npm pack
        working-directory: packages/cli

      - name: Install tarball into clean workspace and scaffold non-interactively
        run: |
          mkdir -p "$RUNNER_TEMP/pkg-test" && cd "$RUNNER_TEMP/pkg-test"
          VERSION=$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version")
          npm install "$GITHUB_WORKSPACE/packages/cli/create-omnicraft-$VERSION.tgz" --no-audit --no-fund
          node node_modules/create-omnicraft/dist/index.js --yes --skip-install my-pkg-app < /dev/null
          test -f my-pkg-app/package.json
          test -f my-pkg-app/client/src/App.tsx
          test -f my-pkg-app/server/src/index.ts
          test -f my-pkg-app/server/.env
          test -f my-pkg-app/.github/workflows/ci.yml
          echo "package e2e OK"

  supported-matrix:
    name: supported-stack-release-gate
    if: ${{ always() }}
    needs:
      - unix
      - database-integration
      - python-fastapi-integration
      - php-laravel-integration
      - support-evidence
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Require all release checks
        env:
          UNIX_MATRIX: ${{ needs.unix.result }}
          NODE_DATABASE: ${{ needs.database-integration.result }}
          PYTHON_DATABASE: ${{ needs.python-fastapi-integration.result }}
          PHP_DATABASE: ${{ needs.php-laravel-integration.result }}
          SUPPORT_EVIDENCE: ${{ needs.support-evidence.result }}
          PACKAGE_ARTIFACT: ${{ needs.package.result }}
        run: |
          for result in "$UNIX_MATRIX" "$NODE_DATABASE" "$PYTHON_DATABASE" "$PHP_DATABASE" "$SUPPORT_EVIDENCE" "$PACKAGE_ARTIFACT"; do
            if [ "$result" != "success" ]; then
              echo "A required release check finished with status: $result"
              exit 1
            fi
          done
          echo "All Supported stack evidence and package checks passed."

  publish-release:
    name: Publish npm package and GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: supported-matrix
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm version with trusted publishing support
        run: npm install --global npm@12.2.1

      - name: Validate release tag and prepare notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_LATEST="$(npm view create-omnicraft version)"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node .github/scripts/release-metadata.mjs notes \
            "$VERSION" "$RUNNER_TEMP/release-notes.md" "$CURRENT_LATEST"

      - name: Install workspace dependencies
        run: npm ci

      - name: Publish package with npm trusted publishing
        working-directory: packages/cli
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          if npm view "create-omnicraft@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED_GIT_HEAD="$(npm view "create-omnicraft@$VERSION" gitHead --json | tr -d '"')"
            if [ "$PUBLISHED_GIT_HEAD" != "$GITHUB_SHA" ]; then
              echo "Version $VERSION already exists on npm from $PUBLISHED_GIT_HEAD, expected $GITHUB_SHA."
              exit 1
            fi
            echo "Version $VERSION is already published from this exact commit; skipping duplicate publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "create-omnicraft $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Update published release documentation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout --force -B main origin/main
          node .github/scripts/release-metadata.mjs mark-published "$VERSION" "$GITHUB_SHA"
          if git diff --quiet -- ROADMAP.md docs/architecture/system-overview.md; then
            echo "Release documentation already records $GITHUB_REF_NAME as published."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ROADMAP.md docs/architecture/system-overview.md
            git commit -m "docs: record $GITHUB_REF_NAME release"
            git push origin HEAD:main
          fi
