# CI for OmniCraft.
#
# Security model (repo is PUBLIC):
# - `pull_request` from forks runs the `unix` jobs on GitHub-hosted runners only.
# - The self-hosted Windows runner executes push-to-main and same-repo PR events
#   only — never fork PRs (untrusted code must not run on a persistent machine).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  # Hosted runners on 3 OSes x Node {20 (declared minimum), 24}.
  # bash is pinned: hosted Windows defaults to pwsh, which can't run the
  # cmd-style cleanup; Git Bash is preinstalled and cross-platform.
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    name: unix (${{ matrix.os }}, node ${{ matrix.node }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit
        working-directory: packages/cli

      - name: Unit tests
        run: npx vitest run
        working-directory: packages/cli

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Scaffold all stack combos
        run: |
          rm -rf smoke-out
          npx tsx packages/cli/scripts/smoke-e2e.ts smoke-out

      # Heavy e2e only on Node 24 to keep the matrix lean;
      # fast checks prove Node 20 (declared minimum) compatibility.
      - name: E2E - install and typecheck generated express+drizzle project
        run: cd smoke-out/smoke-express-drizzle-postgres && npm install --no-audit --no-fund && npx tsc --noEmit -p client && npx tsc --noEmit -p server
        if: matrix.node == 24

  # Docker integration stays on hosted Linux runners and does not slow the
  # cross-platform unit/scaffold matrix or run on the persistent Windows host.
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test creation-time and add-auth Express + Drizzle on SQLite, PostgreSQL, and MySQL
        run: npm run test:integration:db --workspace=create-omnicraft

  node-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - express-prisma-postgres
          - express-raw-sqlite
          - express-raw-postgres
          - express-raw-mysql
          - express-drizzle-sqlite-vue
          - express-drizzle-sqlite-svelte
          - express-drizzle-sqlite-react-js
          - fastify-drizzle-postgres
          - fastify-drizzle-sqlite
          - fastify-drizzle-mysql
          - fastify-prisma-postgres
          - fastify-raw-postgres
          - fastify-raw-sqlite
          - fastify-raw-mysql
          - hono-drizzle-postgres
          - hono-drizzle-sqlite
          - hono-drizzle-mysql
          - hono-raw-postgres
          - hono-raw-sqlite
          - hono-raw-mysql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated Node runtime project (${{ matrix.scenario }})
        run: npm run test:integration:node --workspace=create-omnicraft -- --scenario ${{ matrix.scenario }}

  nextjs-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres, mysql]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated Next.js project (${{ matrix.database }})
        run: npm run test:integration:nextjs --workspace=create-omnicraft -- --database ${{ matrix.database }}

  frontend-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated React/Vite JavaScript frontend-only project
        run: npm run test:integration:frontend --workspace=create-omnicraft

  supabase-auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the production CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Test generated Supabase Auth React/Vite TypeScript project against local Supabase
        run: npm run test:integration:supabase-auth --workspace=create-omnicraft

  docker-module-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated Docker module path (${{ matrix.database }})
        run: npm run test:integration:docker-module --workspace=create-omnicraft -- --database ${{ matrix.database }}

  module-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - add-testing-react-vite-ts
          - add-testing-react-vite-js-frontend-only
          - add-testing-react-vite-ts-separate-api
          - add-testing-react-vite-js-separate-api
          - add-testing-vue-express-drizzle-sqlite
          - add-testing-svelte-express-drizzle-sqlite
          - add-testing-fastapi-sqlite
          - add-testing-laravel-sqlite
          - add-testing-nextjs-sqlite
          - shadcn-react-vite-ts-frontend-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated module path (${{ matrix.scenario }})
        run: npm run test:integration:modules --workspace=create-omnicraft -- --scenario ${{ matrix.scenario }}

  react-vite-add-testing-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group:
          - react-vite-testing-node-none
          - react-vite-testing-python-none
          - react-vite-testing-php-none
          - react-vite-testing-frontend-only-tailwind
          - react-vite-testing-node-tailwind
          - react-vite-testing-python-tailwind
          - react-vite-testing-php-tailwind
          - react-vite-testing-frontend-only-eslint
          - react-vite-testing-node-eslint
          - react-vite-testing-python-eslint
          - react-vite-testing-php-eslint
          - react-vite-testing-frontend-only-eslint-tailwind
          - react-vite-testing-node-eslint-tailwind
          - react-vite-testing-python-eslint-tailwind
          - react-vite-testing-php-eslint-tailwind
          - react-vite-testing-frontend-only-shadcn
          - react-vite-testing-node-shadcn
          - react-vite-testing-python-shadcn
          - react-vite-testing-php-shadcn
          - react-vite-testing-frontend-only-shadcn-eslint
          - react-vite-testing-node-shadcn-eslint
          - react-vite-testing-python-shadcn-eslint
          - react-vite-testing-php-shadcn-eslint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test all exact generated React/Vite add-testing paths (${{ matrix.group }})
        run: npm run test:integration:modules --workspace=create-omnicraft -- --scenario-group ${{ matrix.group }}

  native-platform-integration:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: expo-ios-simulator
            runner: macos-26
          - scenario: expo-android-emulator
            runner: ubuntu-24.04
          - scenario: tauri-linux-desktop
            runner: ubuntu-24.04
          - scenario: tauri-macos-desktop
            runner: macos-26
          - scenario: tauri-windows-desktop
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Android emulator SDK packages
        if: matrix.scenario == 'expo-android-emulator'
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          timeout 5m bash -c 'yes | sdkmanager --licenses >/dev/null'
          timeout 15m sdkmanager --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64"

      - name: Enable KVM for the hosted Android emulator
        if: matrix.scenario == 'expo-android-emulator'
        run: |
          sudo chmod 0666 /dev/kvm
          emulator -accel-check

      - name: Install Tauri Linux and virtual display dependencies
        if: matrix.scenario == 'tauri-linux-desktop'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated native platform path (${{ matrix.scenario }})
        run: npm run test:integration:native --workspace=create-omnicraft -- --scenario ${{ matrix.scenario }}

  php-laravel-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated Laravel API against SQLite, PostgreSQL, and MySQL
        run: npm run test:integration:php --workspace=create-omnicraft

  php-laravel-livewire-auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, zip
          tools: composer:2.10.3
          coverage: none

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the production CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Test generated Laravel Livewire None and native-auth projects on SQLite
        run: npm run test:integration:php-livewire --workspace=create-omnicraft

  php-laravel-inertia-react-auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, zip
          tools: composer:2.10.3
          coverage: none

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the production CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Test generated Laravel Inertia React None and native-auth projects on SQLite
        run: npm run test:integration:php-inertia --workspace=create-omnicraft

  python-fastapi-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: npm ci

      - name: Test generated FastAPI + SQLAlchemy + SQLite and PostgreSQL projects
        run: npm run test:integration:python --workspace=create-omnicraft

  support-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Check Supported rows, evidence targets, and release gate
        run: npm run check:support-matrix --workspace=create-omnicraft

  # Trusted events only: the self-hosted runner never executes fork PR code.
  windows-self-hosted:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit
        working-directory: packages/cli

      - name: Unit tests
        run: npx vitest run
        working-directory: packages/cli

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Scaffold all stack combos
        run: |
          if exist smoke-out rmdir /s /q smoke-out
          npx tsx packages/cli/scripts/smoke-e2e.ts smoke-out

      - name: E2E - install and typecheck generated express+drizzle project
        run: cd smoke-out\smoke-express-drizzle-postgres && npm install --no-audit --no-fund && npx tsc --noEmit -p client && npx tsc --noEmit -p server

      - name: Lint generated project output
        run: cd smoke-out\smoke-express-drizzle-postgres && npx eslint . && npx prettier --check .

  # Package-artifact e2e: pack the tarball, install it into a clean temp dir,
  # run the published-style binary and scaffold a real project from it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Pack tarball
        run: npm pack
        working-directory: packages/cli

      - name: Install tarball into clean workspace and scaffold non-interactively
        run: |
          mkdir -p "$RUNNER_TEMP/pkg-test" && cd "$RUNNER_TEMP/pkg-test"
          VERSION=$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version")
          npm install "$GITHUB_WORKSPACE/packages/cli/create-omnicraft-$VERSION.tgz" --no-audit --no-fund
          node node_modules/create-omnicraft/dist/index.js --yes --skip-install my-pkg-app < /dev/null
          test -f my-pkg-app/package.json
          test -f my-pkg-app/client/src/App.tsx
          test -f my-pkg-app/server/src/index.ts
          test -f my-pkg-app/server/.env
          test -f my-pkg-app/.github/workflows/ci.yml
          echo "package e2e OK"

  supported-matrix:
    name: supported-stack-release-gate
    if: ${{ always() }}
    needs:
      - unix
      - database-integration
      - node-runtime-integration
      - nextjs-runtime-integration
      - frontend-runtime-integration
      - docker-module-integration
      - module-runtime-integration
      - react-vite-add-testing-integration
      - native-platform-integration
      - python-fastapi-integration
      - php-laravel-integration
      - php-laravel-livewire-auth-integration
      - php-laravel-inertia-react-auth-integration
      - supabase-auth-integration
      - support-evidence
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Require all release checks
        env:
          UNIX_MATRIX: ${{ needs.unix.result }}
          NODE_DATABASE: ${{ needs.database-integration.result }}
          NODE_RUNTIME: ${{ needs.node-runtime-integration.result }}
          NEXTJS_RUNTIME: ${{ needs.nextjs-runtime-integration.result }}
          FRONTEND_RUNTIME: ${{ needs.frontend-runtime-integration.result }}
          DOCKER_MODULE: ${{ needs.docker-module-integration.result }}
          MODULE_RUNTIME: ${{ needs.module-runtime-integration.result }}
          REACT_VITE_ADD_TESTING: ${{ needs.react-vite-add-testing-integration.result }}
          NATIVE_PLATFORM: ${{ needs.native-platform-integration.result }}
          PYTHON_DATABASE: ${{ needs.python-fastapi-integration.result }}
          PHP_DATABASE: ${{ needs.php-laravel-integration.result }}
          PHP_LIVEWIRE_AUTH: ${{ needs.php-laravel-livewire-auth-integration.result }}
          PHP_INERTIA_REACT_AUTH: ${{ needs.php-laravel-inertia-react-auth-integration.result }}
          SUPABASE_AUTH: ${{ needs.supabase-auth-integration.result }}
          SUPPORT_EVIDENCE: ${{ needs.support-evidence.result }}
          PACKAGE_ARTIFACT: ${{ needs.package.result }}
        run: |
          for result in "$UNIX_MATRIX" "$NODE_DATABASE" "$NODE_RUNTIME" "$NEXTJS_RUNTIME" "$FRONTEND_RUNTIME" "$DOCKER_MODULE" "$MODULE_RUNTIME" "$REACT_VITE_ADD_TESTING" "$NATIVE_PLATFORM" "$PYTHON_DATABASE" "$PHP_DATABASE" "$PHP_LIVEWIRE_AUTH" "$PHP_INERTIA_REACT_AUTH" "$SUPABASE_AUTH" "$SUPPORT_EVIDENCE" "$PACKAGE_ARTIFACT"; do
            if [ "$result" != "success" ]; then
              echo "A required release check finished with status: $result"
              exit 1
            fi
          done
          echo "All Supported stack evidence and package checks passed."

  publish-release:
    name: Publish npm package and GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: supported-matrix
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm version with trusted publishing support
        run: npm install --global npm@12.2.1

      - name: Validate release tag and prepare notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_LATEST="$(npm view create-omnicraft version)"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node .github/scripts/release-metadata.mjs notes \
            "$VERSION" "$RUNNER_TEMP/release-notes.md" "$CURRENT_LATEST"

      - name: Install workspace dependencies
        run: npm ci

      - name: Publish package with npm trusted publishing
        working-directory: packages/cli
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          if npm view "create-omnicraft@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED_GIT_HEAD="$(npm view "create-omnicraft@$VERSION" gitHead --json | tr -d '"')"
            if [ "$PUBLISHED_GIT_HEAD" != "$GITHUB_SHA" ]; then
              echo "Version $VERSION already exists on npm from $PUBLISHED_GIT_HEAD, expected $GITHUB_SHA."
              exit 1
            fi
            echo "Version $VERSION is already published from this exact commit; skipping duplicate publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_TITLE="$(node .github/scripts/release-metadata.mjs title "$VERSION")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$RELEASE_TITLE"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Update published release documentation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout --force -B main origin/main
          node .github/scripts/release-metadata.mjs mark-published "$VERSION" "$GITHUB_SHA"
          if git diff --quiet -- ROADMAP.md docs/architecture/system-overview.md; then
            echo "Release documentation already records $GITHUB_REF_NAME as published."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ROADMAP.md docs/architecture/system-overview.md
            git commit -m "docs: record $GITHUB_REF_NAME release"
            git push origin HEAD:main
          fi
