name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit
        working-directory: packages/cli

      - name: Unit tests
        run: npx vitest run
        working-directory: packages/cli

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Scaffold all stack combos
        run: |
          if exist smoke-out rmdir /s /q smoke-out
          npx tsx packages/cli/scripts/smoke-e2e.ts smoke-out

      - name: E2E - install and typecheck generated express+drizzle project
        run: cd smoke-out\smoke-express-drizzle-postgres && npm install --no-audit --no-fund && npx tsc --noEmit -p client && npx tsc --noEmit -p server

      - name: Lint generated project output
        run: cd smoke-out\smoke-express-drizzle-postgres && npx eslint . && npx prettier --check .

  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit
        working-directory: packages/cli

      - name: Unit tests
        run: npx vitest run
        working-directory: packages/cli

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Scaffold all stack combos
        run: |
          rm -rf smoke-out
          npx tsx packages/cli/scripts/smoke-e2e.ts smoke-out

      - name: E2E - install and typecheck generated express+prisma project
        run: cd smoke-out/smoke-express-prisma-postgres && npm install --no-audit --no-fund && npx tsc --noEmit -p client && npx tsc --noEmit -p server
