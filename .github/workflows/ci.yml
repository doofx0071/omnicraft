name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npx tsc --noEmit
        working-directory: packages/cli

      - name: Unit tests
        run: npx vitest run
        working-directory: packages/cli

      - name: Build CLI
        run: npx tsup
        working-directory: packages/cli

      - name: Scaffold all stack combos
        run: |
          if (Test-Path smoke-out) { Remove-Item -Recurse -Force smoke-out }
          npx tsx packages/cli/scripts/smoke-e2e.ts smoke-out

      - name: E2E - install and typecheck generated express+drizzle project
        run: |
          cd smoke-out/smoke-express-drizzle
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc --noEmit -p client
          npx tsc --noEmit -p server
