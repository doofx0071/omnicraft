[project]
name = "{{projectName}}-server"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "asyncpg>=0.29",
]

# uv installs the `dev` group by default (PEP 735), so `uv sync` alone
# provides pytest, httpx (for fastapi's TestClient), and ruff.
[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
]

# `uv run pytest` from server/ — pythonpath makes the `app` package
# importable without any extra files.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
