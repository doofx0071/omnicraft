name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # DATABASE_URL is only needed so `prisma generate` can run during
      # postinstall — it does not connect to the database.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      - name: Typecheck client
        run: npx tsc --noEmit -p client

      - name: Typecheck server
        run: npx tsc --noEmit -p server

      - name: Build
        run: npm run build

      # The health test never queries the database; DATABASE_URL only keeps
      # the server's env validation (and ORM client construction) happy.
      - name: Test server
        run: npm test -w server
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
